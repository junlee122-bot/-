name: Daily pipeline

# 매일 자동으로 수집→분석→Supabase 적재 (run_full_pipeline).
# 비밀키는 레포 Settings → Secrets and variables → Actions 에 등록한다:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ODDS_API_KEY
# (선택) variables: DATA_SOURCE_MODE, ODDS_API_REGIONS, BETMAN_SOURCE,
#         RSS_FEEDS_SOCCER, RSS_FEEDS_BASEBALL, RSS_FEEDS_BASKETBALL

on:
  schedule:
    # UTC 22:00 = KST 07:00 (매일 아침). cron 은 UTC 기준.
    - cron: "0 22 * * *"
  workflow_dispatch: {}        # 수동 실행 버튼

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline
        env:
          # 비밀 (Secrets) — Firebase 서비스계정 JSON 의 base64 문자열
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # 비밀 아닌 설정 (Variables, 기본값 포함)
          DATA_SOURCE_MODE: ${{ vars.DATA_SOURCE_MODE || 'live' }}
          ODDS_API_REGIONS: ${{ vars.ODDS_API_REGIONS || 'eu' }}
          BETMAN_SOURCE: ${{ vars.BETMAN_SOURCE || 'mock' }}
          RSS_FEEDS_SOCCER: ${{ vars.RSS_FEEDS_SOCCER }}
          RSS_FEEDS_BASEBALL: ${{ vars.RSS_FEEDS_BASEBALL }}
          RSS_FEEDS_BASKETBALL: ${{ vars.RSS_FEEDS_BASKETBALL }}
        run: python -m scripts.run_full_pipeline
